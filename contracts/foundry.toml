[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pin the compiler and optimizer so local snapshots and deployment bytecode agree.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Compiler warnings must be resolved before deployment.
deny = "warnings"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
