# Merge with indexer/compose.yaml; never replace unrelated compose projects.
# Bind only the existing Caddy bridge's host gateway, not a public interface.
services:
  postgres:
    restart: unless-stopped
    mem_limit: 128m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
  graphql:
    restart: unless-stopped
    mem_limit: 320m
    ports: !override
      - "${MONADBOY_PROXY_GATEWAY:?Set the existing Caddy host bridge gateway}:18880:8080"
    environment:
      HASURA_GRAPHQL_CORS_DOMAIN: ${APP_ORIGIN:?Set the canonical frontend HTTPS origin}
      HASURA_GRAPHQL_PG_CONNECTIONS: "10"
  indexer:
    restart: unless-stopped
    # Dependency installation/codegen need a larger, explicit one-shot ceiling.
    mem_limit: ${MONADBOY_INDEXER_MEMORY:-192m}
    environment:
      NODE_OPTIONS: --max-old-space-size=128
