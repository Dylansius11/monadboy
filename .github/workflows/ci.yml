name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      # Bun installs and runs the scripts, but Vite and Vitest are Node
      # processes. Pinning Node here keeps CI on the same runtime the README
      # tells a human to use.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # --frozen-lockfile makes bun.lock authoritative. A dependency that
      # drifted without a committed lockfile change fails here rather than on
      # somebody's laptop at 11:35 on the day.
      - name: install
        run: bun install --frozen-lockfile

      - name: verify
        run: bun run verify

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: test
        run: forge test
        working-directory: contracts

      - name: formatting
        run: forge fmt --check
        working-directory: contracts

  indexer:
    name: indexer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIO_PG_PASSWORD: ci-only-not-used
      HASURA_GRAPHQL_ADMIN_SECRET: ci-only-not-used
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v7
      - name: Build pinned Linux tooling
        run: docker compose build indexer
      - name: Install locked indexer dependencies
        run: docker compose run --rm --no-deps --entrypoint sh indexer -c "pnpm install --frozen-lockfile"
      - name: Generate real handler types
        run: docker compose run --rm --no-deps --entrypoint node indexer node_modules/envio/bin.mjs codegen
      - name: Check projections
        run: docker compose run --rm --no-deps --entrypoint sh indexer -c "pnpm typecheck && pnpm test"
